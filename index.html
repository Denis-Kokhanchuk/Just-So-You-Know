<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg1:#f9d3ea;--bg2:#d9cdfa;--bg3:#cfe0ff;--card:#fff;--ink:#1d1b33;--sub:#7b5cd6;--pink:#ff3d71;--blue:#6fb4ff;--mute:#a9a6c4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#3a2347;--bg2:#2a2650;--bg3:#1f2d52;--card:#2b2842;--ink:#f4f1ff;--sub:#b9a4ff;--mute:#7f7ca3}}
:root[data-theme="dark"]{--bg1:#3a2347;--bg2:#2a2650;--bg3:#1f2d52;--card:#2b2842;--ink:#f4f1ff;--sub:#b9a4ff;--mute:#7f7ca3}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:Nunito,system-ui,sans-serif;background:linear-gradient(160deg,var(--bg1),var(--bg2) 55%,var(--bg3));color:var(--ink);overflow:hidden;user-select:none}
#app{height:100%;display:flex;flex-direction:column;align-items:center;padding:18px 18px 14px;max-width:520px;margin:auto;position:relative}
@media (min-width:600px){body{display:grid;place-items:center}#app{width:420px;height:min(100%,860px);border-radius:38px;background:rgba(255,255,255,.28);box-shadow:0 30px 80px rgba(100,70,180,.3);padding:26px 22px 18px}}
.pill{align-self:stretch;background:#111;color:#fff;border-radius:30px;padding:7px 14px;display:flex;align-items:center;gap:10px;font-size:14px;font-weight:800}
.pill small{display:block;font-weight:600;opacity:.6;font-size:11px}
.pill i{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--pink),var(--blue))}
.bars{margin-left:auto;display:flex;gap:2px;align-items:center;height:16px}
.bars b{width:3px;background:#d86bff;border-radius:2px;height:5px;animation:eq .6s infinite alternate}
.bars b:nth-child(2){animation-delay:.15s}.bars b:nth-child(3){animation-delay:.3s}.bars b:nth-child(4){animation-delay:.1s}
@keyframes eq{to{height:16px}}
#stage{flex:1;width:100%;display:flex;align-items:center;position:relative}
.card{width:100%;background:var(--card);border-radius:26px;padding:18px;box-shadow:0 14px 40px rgba(120,90,200,.22);min-height:310px;position:relative;overflow:hidden;animation:in .6s cubic-bezier(.2,.9,.3,1.2)}
.card.clear{background:none;box-shadow:none;overflow:visible}
@keyframes in{from{transform:scale(.86) translateY(20px);opacity:0}}
.hd{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:18px;color:#fff;flex:none}
.hd b{font-size:17px;display:block}.hd span{font-size:12px;color:var(--sub);font-weight:800}
.row{display:flex;justify-content:center;align-items:center;margin:8px 0;gap:6px}
.dot{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;font-size:28px;font-weight:900;color:#fff;flex:none}
.me{background:var(--blue)}.you{background:#ff6fa0}
.big{font-size:44px;font-weight:900;text-align:center;color:var(--pink)}
.mid{text-align:center;font-size:15px;font-weight:800;color:var(--sub)}
.bar{height:6px;border-radius:4px;background:linear-gradient(90deg,var(--blue),var(--pink));margin:10px 0 8px;transform-origin:left;animation:bar 2.4s both ease-out}
@keyframes bar{from{transform:scaleX(.68)}}
.pop{animation:pop2 .55s var(--d,0s) both cubic-bezier(.2,1.6,.4,1)}
@keyframes pop2{from{transform:scale(0) rotate(-12deg);opacity:0}}
.slam{animation:slam .45s var(--d,0s) both cubic-bezier(.3,1.4,.5,1)}
@keyframes slam{from{transform:scale(3) rotate(-14deg);opacity:0}}
@keyframes fromL{from{transform:translateX(-110px) scale(.7);opacity:0}}
@keyframes fromR{from{transform:translateX(110px) scale(.7);opacity:0}}
.hrt{font-size:38px;color:var(--pink);animation:beat .8s infinite}
@keyframes beat{40%{transform:scale(1.35)}}
.sticker{position:absolute;left:14px;top:96px;background:#fcd34d;color:#4a3300;font-weight:900;font-size:14px;padding:4px 10px;border-radius:8px;transform:rotate(-8deg);z-index:2}
.sw{width:52px;height:30px;border-radius:15px;background:#cfcbe3;position:relative;animation:swon .3s 3s forwards}
.sw i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.25);animation:kn .3s 3s forwards}
@keyframes swon{to{background:#22c55e}}@keyframes kn{to{transform:translateX(22px)}}
.btns{display:flex;gap:10px;margin-top:20px}.btns div{flex:1;text-align:center;padding:15px;border-radius:14px;background:rgba(120,100,200,.12);font-weight:900;font-size:18px}
.btns .no{animation:bye 1s 1.8s forwards ease-in}
@keyframes bye{25%{background:#c9c9d3;color:#fff;transform:scale(.95)}100%{background:#c9c9d3;color:#fff;transform:translate(-60px,-170px) rotate(-40deg) scale(.4);opacity:0}}
.btns .yes{animation:yes .6s 1.8s forwards}

.stamp{position:absolute;right:14px;bottom:20px;font-size:28px;font-weight:900;color:var(--pink);border:4px solid var(--pink);border-radius:12px;padding:2px 12px;transform:rotate(-10deg);--d:3s}
.tk{display:flex;justify-content:space-between;font-size:38px;font-weight:900;margin:16px 0 0}
.tk span:first-child{color:var(--sub);animation:fromL .6s both}.tk span:last-child{color:var(--mute);animation:fromR .6s both,sea .5s 4.2s forwards}
@keyframes sea{to{color:#14b8a6;transform:scale(1.15)}}
.sky{position:relative;width:280px;height:110px;margin:0 auto}
.sky svg{position:absolute;inset:0}
.trail{stroke-dasharray:1;stroke-dashoffset:1;animation:dr 3.6s .6s forwards ease-in-out}
@keyframes dr{to{stroke-dashoffset:0}}
.plane{position:absolute;left:0;top:0;width:28px;height:22px;offset-path:path("M10 95 Q140 -25 270 75");offset-rotate:auto;offset-distance:0;animation:fl 3.6s .6s forwards ease-in-out}
@keyframes fl{to{offset-distance:100%}}
.pair{position:relative;height:130px;margin-top:4px}
.ground{position:absolute;left:10px;right:10px;bottom:30px;height:3px;background:var(--mute);border-radius:2px;opacity:.5}
.boot{position:absolute;bottom:34px;width:46px;height:56px;transform-origin:50% 100%}
.b1{left:calc(50% - 41px);animation:j1 1.2s both cubic-bezier(.3,1.2,.5,1),hug 1.2s 1.2s infinite alternate ease-in-out}
.b2{left:calc(50% - 5px);z-index:1;animation:j2 1.2s both cubic-bezier(.3,1.2,.5,1),hug2 1.2s 1.2s infinite alternate ease-in-out}
@keyframes j1{from{transform:translateX(-95px) rotate(-14deg);opacity:0}to{transform:rotate(8deg)}}
@keyframes j2{from{transform:translateX(95px) rotate(14deg);opacity:0}to{transform:rotate(-8deg)}}
@keyframes hug{from{transform:rotate(8deg)}to{transform:rotate(14deg) scale(1.05)}}
@keyframes hug2{from{transform:rotate(-8deg)}to{transform:rotate(-14deg) scale(1.05)}}
.arm{transform-box:fill-box;transform-origin:0 50%;animation:arm .4s 1.2s both}
@keyframes arm{from{transform:scaleX(0)}}
.lbl{position:absolute;bottom:6px;font-weight:800;color:var(--sub);font-size:14px}
.camp{position:relative;height:150px;margin-top:6px}
.glow{position:absolute;left:50%;bottom:10px;width:180px;height:180px;margin-left:-90px;border-radius:50%;background:radial-gradient(#ffb34755,transparent 65%);animation:gl 3s .6s both}
@keyframes gl{from{transform:scale(.4);opacity:.3}}
.fire{position:absolute;left:50%;bottom:20px;width:54px;height:72px;margin-left:-27px;transform-origin:50% 100%;animation:fk .35s infinite alternate ease-in-out}
@keyframes fk{to{transform:scale(1.07,.94) skewX(3deg)}}
.log{position:absolute;left:50%;bottom:16px;width:64px;height:9px;margin-left:-32px;background:#7c4a24;border-radius:5px}
.log+.log{transform:rotate(-14deg)}
.av{position:absolute;bottom:18px;width:46px;height:46px;font-size:20px}
.av.l{left:6px;animation:ap 3s .6s both ease-in-out}.av.r{right:6px;animation:ap2 3s .6s both ease-in-out}
@keyframes ap{to{left:calc(50% - 82px)}}@keyframes ap2{to{right:calc(50% - 82px)}}
.sp{position:absolute;bottom:80px;left:50%;width:4px;height:4px;border-radius:50%;background:#fbbf24;animation:spk 1.4s infinite}
@keyframes spk{from{transform:translate(0,0);opacity:1}to{transform:translate(var(--x,10px),-70px);opacity:0}}
.night{border-radius:16px;overflow:hidden;position:relative;height:215px}
.night svg{display:block;width:100%;height:100%}
.nw{animation:nw 4.8s linear infinite}
@keyframes nw{from{transform:translateX(-125px)}to{transform:translateX(75px)}}
.lg{transform-box:fill-box;transform-origin:50% 0}
.lg.a{animation:lg .5s infinite alternate ease-in-out}.lg.b{animation:lg .5s infinite alternate-reverse ease-in-out}
@keyframes lg{from{transform:rotate(-24deg)}to{transform:rotate(24deg)}}
.gl2{animation:tw 1.6s infinite}
@keyframes tw{0%,100%{opacity:0}50%{opacity:.95}}
.streak{animation:str 2s infinite alternate}@keyframes str{to{opacity:.55}}
.st{transform-box:fill-box;transform-origin:center;opacity:0;animation:stw 2.4s infinite}

.temp{position:absolute;top:8px;right:12px;font-size:12px;color:#fff;font-weight:800}
.ring{position:relative;width:150px;height:150px;margin:0 auto 14px;display:grid;place-items:center}
.ring:before{content:"";position:absolute;inset:0;border-radius:50%;border:4px dashed var(--pink);animation:sp2 16s linear infinite}
@keyframes sp2{to{transform:rotate(360deg)}}
.fin{text-align:center;width:100%}
.fin h1{font-size:60px;font-weight:900;display:flex;justify-content:center}
.fin h1 span{display:inline-block;background:linear-gradient(90deg,#ff6fa0,#9b7bff);-webkit-background-clip:text;background-clip:text;color:transparent;animation:pop2 .6s both cubic-bezier(.2,1.6,.4,1)}
.fin p{color:var(--sub);font-weight:800;margin-top:6px;animation:in .6s 2.4s both}
.ring+h1{margin-top:4px}
.h{position:fixed;pointer-events:none;font-size:20px;animation:up 1.8s forwards;z-index:5;color:#ff3d71}
@keyframes up{to{transform:translateY(-170px) scale(1.4) rotate(20deg);opacity:0}}
.ci{position:absolute;pointer-events:none;color:#fff;opacity:.7;animation:tw 3s infinite;font-size:14px}
#dots{display:flex;gap:6px;margin:10px 0}#dots i{width:6px;height:6px;border-radius:3px;background:var(--mute);transition:.3s}#dots i.a{width:22px;background:var(--ink)}
.title{font-size:20px;font-weight:900}
#seek{width:100%;height:4px;border-radius:3px;background:rgba(120,100,200,.25);margin:10px 0 4px;overflow:hidden}#seek i{display:block;height:100%;width:0;background:linear-gradient(90deg,#d86bff,var(--pink))}
.hf{position:absolute;left:0;top:0;margin-left:-18px;animation:hx 2.4s .6s both linear}@keyframes hx{from{left:0}to{left:100%}}
.hy{font-size:36px;line-height:1;color:var(--pink);animation:hy 2.4s .6s both ease-out}@keyframes hy{0%{transform:translateY(0) scale(.6)}50%{transform:translateY(-46px) scale(1.4)}90%{transform:translateY(0) scale(1)}100%{transform:translateY(0) scale(0)}}
.ya{animation:ya .5s 3s}@keyframes ya{40%{transform:scale(1.22)}}
.rg{position:absolute;border-radius:50%;border:3px solid var(--pink);animation:rg 1.5s infinite}
@keyframes rg{from{transform:scale(.6);opacity:1}to{transform:scale(2);opacity:0}}
#start{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:linear-gradient(160deg,var(--bg1),var(--bg2) 55%,var(--bg3));font-weight:900;font-size:20px;color:var(--ink);cursor:pointer;transition:opacity .5s}
#start.off{opacity:0;pointer-events:none}
#start .hrt{font-size:84px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important}}
</style>
</head>
